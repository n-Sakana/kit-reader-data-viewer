<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="ending" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <rect id="page-rule" x="0" y="0" width="1280" height="6" fill="#24507F" data-pptx-role="decoration"/>

  <g id="page-head" data-pptx-bounds="64 60 1152 116">
    <text x="64" y="108" font-size="40" font-weight="700" fill="#1F2A37">動作要件と、設定を変えるとき</text>
    <text x="64" y="148" font-size="21" fill="#5D6B7A">設定を変える人は、窓を開く前に 2 つの検査を自分で実行します。</text>
    <rect x="64" y="168" width="1152" height="1" fill="#CFD7DE"/>
  </g>

  <g id="requirements" data-pptx-bounds="64 186 368 338">
    <text x="64" y="206" font-size="20" font-weight="700" fill="#24507F">動作要件</text>
    <rect x="64" y="222" width="368" height="298" rx="12" fill="#F2F6FB"/>
    <text x="88" y="262" font-size="18" fill="#1F2A37">64 ビット Windows</text>
    <text x="88" y="300" font-size="18" fill="#1F2A37">Windows PowerShell 5.1</text>
    <text x="88" y="324" font-size="16" fill="#5D6B7A">（.NET Framework・WPF）</text>
    <text x="88" y="364" font-size="18" fill="#1F2A37">WebView2 Runtime</text>
    <text x="88" y="402" font-size="18" fill="#1F2A37">一式をフォルダーごと置く</text>
    <text x="88" y="440" font-size="18" fill="#1F2A37">起動は ReaderDataViewer.vbs</text>
  </g>

  <g id="settings-change" data-pptx-bounds="456 186 368 338">
    <text x="456" y="206" font-size="20" font-weight="700" fill="#24507F">設定を変えるとき</text>
    <rect x="456" y="222" width="368" height="298" rx="12" fill="#F2F6FB"/>
    <text x="480" y="260" font-size="18" font-weight="700" fill="#1F2A37">① -ValidateOnly</text>
    <text x="480" y="284" font-size="16" fill="#1F2A37">設定・入力の見出し・キー・型、<tspan x="480" dy="22">ジョブのつながりを検査する</tspan><tspan x="480" dy="22" fill="#5D6B7A">（台帳は作らない）</tspan></text>
    <text x="480" y="368" font-size="18" font-weight="700" fill="#1F2A37">② -RunUpdate</text>
    <text x="480" y="392" font-size="16" fill="#1F2A37">更新ジョブを実行し、結果を JSON に<tspan x="480" dy="22" fill="#5D6B7A">（共有台帳・未送信には書かない）</tspan></text>
    <text x="480" y="454" font-size="18" font-weight="700" fill="#1F2A37">③ 試験用に開いて操作する</text>
    <text x="480" y="478" font-size="16" fill="#1F2A37">ReaderDataViewer.vbs で起動</text>
    <text x="480" y="508" font-size="16" fill="#5D6B7A">詳しくは README の「三段で確かめる」</text>
  </g>

  <g id="mechanism" data-pptx-bounds="848 186 368 338">
    <text x="848" y="206" font-size="20" font-weight="700" fill="#24507F">仕組みの要点</text>
    <rect x="848" y="222" width="368" height="298" rx="12" fill="none" stroke="#E2E7EC" stroke-width="1"/>
    <g id="mechanism-points" fill="#1F2A37" font-size="16">
      <text x="872" y="256">台帳は LEDGER シート 1 枚。<tspan x="872" dy="22">書式や数式は残さない。</tspan></text>
      <text x="872" y="312">送信・更新・削除は、<tspan x="872" dy="22">同じ共有ロックの中で書く。</tspan></text>
      <text x="872" y="368">未送信は Windows ユーザーと<tspan x="872" dy="22">台帳ごとに、この PC に残る。</tspan></text>
      <text x="872" y="424">書き込みが確定するまで、<tspan x="872" dy="22">アプリは閉じない。</tspan></text>
      <text x="872" y="480">帳票出力は新しいファイルだけ。<tspan x="872" dy="22">入力・台帳・設定へは書かない。</tspan></text>
    </g>
  </g>

  <g id="closing" data-pptx-bounds="64 536 1152 112">
    <rect x="64" y="540" width="1152" height="104" rx="12" fill="#FFFFFF" stroke="#CFD7DE" stroke-width="1"/>
    <rect x="64" y="540" width="5" height="104" rx="2.5" fill="#24507F"/>
    <text x="92" y="580" font-size="20" font-weight="700" fill="#24507F">1 件ずつ確かめて、まとめて送る。</text>
    <text x="92" y="614" font-size="18" fill="#1F2A37">詳しい設定は README.md（三段で確かめる・全項目索引）、docs/settings.md、docs/shared-ledger.md へ。</text>
  </g>

  <g id="page-footer" data-pptx-bounds="64 656 1152 30" data-pptx-role="footer" fill="#5D6B7A" font-size="14">
    <text x="64" y="676">P22</text>
    <text x="1216" y="676" text-anchor="end">Reader Data Viewer（2026-09-10 の版）</text>
  </g>
</svg>
