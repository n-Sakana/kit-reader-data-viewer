<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <rect id="page-rule" x="0" y="0" width="1280" height="6" fill="#24507F" data-pptx-role="decoration"/>

  <g id="page-head" data-pptx-bounds="42 44 1174 140">
    <rect x="64" y="50" width="76" height="28" rx="14" fill="#24507F"/>
    <text x="102" y="69" font-size="15" fill="#FFFFFF" text-anchor="middle">手順 5</text>
    <text x="42" y="124" font-size="40" font-weight="700" fill="#1F2A37">［データ削除］で処理済の行を消します</text>
    <text x="64" y="160" font-size="21" fill="#5D6B7A">削除の判定は、共有台帳に保存済みの状態で行います。</text>
    <rect x="64" y="178" width="1152" height="1" fill="#CFD7DE"/>
  </g>

  <g id="shot-delete-dialog" data-pptx-bounds="64 192 632 434">
    <rect x="64" y="196" width="632" height="399" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image href="../images/18-delete-dialog.png" x="80" y="212" width="600" height="366.9" preserveAspectRatio="xMidYMid meet"/>
    <text x="64" y="620" font-size="16" fill="#5D6B7A">「レコード削除」。処理内容の 4 段で対象を絞り、［削除する］で消します。</text>
  </g>

  <g id="delete-condition" data-pptx-bounds="728 194 488 264">
    <text x="728" y="214" font-size="20" font-weight="700" fill="#24507F">消えるのは、重なった行だけ</text>
    <ellipse cx="866" cy="300" rx="118" ry="72" fill="#24507F" fill-opacity="0.12" stroke="#24507F" stroke-width="1.5"/>
    <ellipse cx="1018" cy="300" rx="118" ry="72" fill="#2B5C96" fill-opacity="0.12" stroke="#2B5C96" stroke-width="1.5"/>
    <text x="820" y="294" font-size="16" fill="#1F2A37" text-anchor="middle">④の組と<tspan x="820" dy="22">一致</tspan></text>
    <text x="1064" y="294" font-size="16" fill="#1F2A37" text-anchor="middle">保存済みで<tspan x="1064" dy="22">処理済</tspan></text>
    <text x="942" y="307" font-size="18" font-weight="700" fill="#1F2A37" text-anchor="middle">削除</text>
    <text x="728" y="404" font-size="16" fill="#1F2A37">撮影では、送信済みの処理済 2 件のうち<tspan x="728" dy="22">HD10000137FL は未処理に戻っていたので、</tspan><tspan x="728" dy="22">削除は AA10000000AA の 1 件（100 → 99 件）。</tspan></text>
  </g>

  <g id="delete-caution" data-pptx-bounds="728 470 488 180">
    <rect x="728" y="474" width="488" height="174" rx="12" fill="#FFFFFF" stroke="#CFD7DE" stroke-width="1"/>
    <rect x="728" y="474" width="5" height="174" rx="2.5" fill="#C05B21"/>
    <text x="752" y="506" font-size="16" fill="#1F2A37"><tspan x="752" dy="0" font-weight="700" fill="#C05B21">手元で処理済にしただけでは、消えません。</tspan><tspan x="752" dy="24">送信して共有台帳に保存してから実行します。</tspan></text>
    <text x="752" y="570" font-size="16" fill="#1F2A37"><tspan x="752" dy="0" font-weight="700">消した行も、入力ファイルに残っていれば、</tspan><tspan x="752" dy="24">次の［データ更新］で再び追加されることがあります。</tspan></text>
  </g>

  <g id="page-footer" data-pptx-bounds="64 656 1152 30" data-pptx-role="footer" fill="#5D6B7A" font-size="14">
    <text x="64" y="676">P17</text>
    <text x="1216" y="676" text-anchor="end">同梱サンプルで一通り使う</text>
  </g>
</svg>
