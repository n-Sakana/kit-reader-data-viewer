<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <rect id="page-rule" x="0" y="0" width="1280" height="6" fill="#24507F" data-pptx-role="decoration"/>

  <g id="page-head" data-pptx-bounds="64 44 1152 140">
    <rect x="64" y="50" width="76" height="28" rx="14" fill="#24507F"/>
    <text x="102" y="69" font-size="15" fill="#FFFFFF" text-anchor="middle">手順 2</text>
    <text x="64" y="124" font-size="40" font-weight="700" fill="#1F2A37">起動して、台帳を作ります</text>
    <text x="64" y="160" font-size="21" fill="#5D6B7A">ReaderDataViewer.vbs で起動すると、入力を読んで台帳と突き合わせます。</text>
    <rect x="64" y="178" width="1152" height="1" fill="#CFD7DE"/>
  </g>

  <g id="shot-no-ledger" data-pptx-bounds="64 192 560 178">
    <rect x="64" y="196" width="560" height="146" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image href="../images/01-startup-create-ledger.png" x="80" y="212" width="528" height="113.7" preserveAspectRatio="xMidYMid meet"/>
    <text x="64" y="364" font-size="16" fill="#5D6B7A">台帳がないとき。［はい］で入力ファイルから台帳を作ります。</text>
  </g>

  <g id="shot-difference" data-pptx-bounds="64 376 560 192">
    <rect x="64" y="380" width="560" height="160" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image href="../images/16-update-confirm.png" x="80" y="396" width="528" height="128.1" preserveAspectRatio="xMidYMid meet"/>
    <text x="64" y="562" font-size="16" fill="#5D6B7A">入力と台帳に差があるとき。［いいえ］なら保存済みの台帳のまま。</text>
  </g>

  <g id="import-note" data-pptx-bounds="64 576 560 74">
    <rect x="64" y="580" width="560" height="66" rx="10" fill="#F2F6FB"/>
    <text x="84" y="605" font-size="16" fill="#1F2A37">どちらも「更新の確認」です。ファイルを置いただけでは<tspan x="84" dy="24">台帳は変わらず、起動時の確認か［データ更新］で取り込みます。</tspan></text>
  </g>

  <g id="shot-ready" data-pptx-bounds="656 192 560 458">
    <rect x="656" y="196" width="560" height="424" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image href="../images/02-main-ready.png" x="672" y="212" width="528" height="392" preserveAspectRatio="xMidYMid meet"/>
    <text x="656" y="642" font-size="16" fill="#5D6B7A">作成後の主画面。台帳件数 100、決済状況は「未検索」。</text>
  </g>

  <g id="page-footer" data-pptx-bounds="64 656 1152 30" data-pptx-role="footer" fill="#5D6B7A" font-size="14">
    <text x="64" y="676">P08</text>
    <text x="1216" y="676" text-anchor="end">同梱サンプルで一通り使う</text>
  </g>
</svg>
