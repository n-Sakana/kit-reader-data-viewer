<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <rect id="page-rule" x="0" y="0" width="1280" height="6" fill="#24507F" data-pptx-role="decoration"/>

  <g id="page-head" data-pptx-bounds="64 44 1152 140">
    <rect x="64" y="50" width="76" height="28" rx="14" fill="#24507F"/>
    <text x="102" y="69" font-size="15" fill="#FFFFFF" text-anchor="middle">手順 4</text>
    <text x="64" y="124" font-size="40" font-weight="700" fill="#1F2A37">中身が変わった行は、未処理に戻ります</text>
    <text x="64" y="160" font-size="21" fill="#5D6B7A">台帳に保存する入力の列が変わると、その行の印は初期状態へ戻ります。</text>
    <rect x="64" y="178" width="1152" height="1" fill="#CFD7DE"/>
  </g>

  <g id="shot-update-confirm" data-pptx-bounds="64 192 560 196">
    <rect x="64" y="196" width="560" height="160" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image href="../images/16-update-confirm.png" x="80" y="212" width="528" height="128.1" preserveAspectRatio="xMidYMid meet"/>
    <text x="64" y="380" font-size="16" fill="#5D6B7A">差があるときの「更新の確認」。［はい］で書き換えます。</text>
  </g>

  <g id="what-we-did" data-pptx-bounds="656 194 560 194">
    <text x="656" y="214" font-size="20" font-weight="700" fill="#24507F">撮影で行ったこと</text>
    <g id="did-marks" fill="#24507F">
      <circle cx="668" cy="241" r="11"/>
      <circle cx="668" cy="273" r="11"/>
      <circle cx="668" cy="327" r="11"/>
      <circle cx="668" cy="359" r="11"/>
    </g>
    <g id="did-mark-numbers" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">
      <text x="668" y="246">1</text>
      <text x="668" y="278">2</text>
      <text x="668" y="332">3</text>
      <text x="668" y="364">4</text>
    </g>
    <g id="did-items" fill="#1F2A37" font-size="16">
      <text x="688" y="246">AA10000000AA と HD10000137FL を処理済にして送信</text>
      <text x="688" y="278">撮影用の写しの②で HD10000137FL の決済金額を<tspan x="688" dy="22">3055 → 3155 に変えた</tspan></text>
      <text x="688" y="332">［データ更新］→［実行］→［はい］</text>
      <text x="688" y="364">HD10000137FL だけ「未処理」に戻り、下の一覧に出た</text>
    </g>
  </g>

  <g id="shot-reset-list" data-pptx-bounds="64 400 1152 250">
    <rect x="64" y="404" width="1152" height="182" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image href="../images/17-reset-list.png" x="80" y="420" width="1120" height="149.7" preserveAspectRatio="xMidYMid meet"/>
    <text x="64" y="608" font-size="16" fill="#5D6B7A">「台帳の更新」に、未処理に戻った行が並びます。</text>
    <text x="64" y="636" font-size="16" fill="#1F2A37">取消の列だけでなく、保存する列のどれが変わっても戻ります（設定 onSourceChange: reset。preserve なら戻さない）。</text>
  </g>

  <g id="page-footer" data-pptx-bounds="64 656 1152 30" data-pptx-role="footer" fill="#5D6B7A" font-size="14">
    <text x="64" y="676">P16</text>
    <text x="1216" y="676" text-anchor="end">同梱サンプルで一通り使う</text>
  </g>
</svg>
