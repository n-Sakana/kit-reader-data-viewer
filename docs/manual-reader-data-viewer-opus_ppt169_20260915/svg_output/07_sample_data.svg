<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <rect id="page-rule" x="0" y="0" width="1280" height="6" fill="#24507F" data-pptx-role="decoration"/>

  <g id="page-head" data-pptx-bounds="64 44 1152 140">
    <rect x="64" y="50" width="76" height="28" rx="14" fill="#24507F"/>
    <text x="102" y="69" font-size="15" fill="#FFFFFF" text-anchor="middle">手順 1</text>
    <text x="64" y="124" font-size="40" font-weight="700" fill="#1F2A37">例に使う同梱サンプル</text>
    <text x="64" y="160" font-size="21" fill="#5D6B7A">4 つの入力ファイル（各 100 件）から、100 件の台帳を作ります。</text>
    <rect x="64" y="178" width="1152" height="1" fill="#CFD7DE"/>
  </g>

  <g id="input-files" data-pptx-bounds="64 194 520 392">
    <g id="file-map">
      <rect x="64" y="196" width="520" height="88" rx="12" fill="#F2F6FB"/>
      <use data-icon="tabler-filled/file-text" x="84" y="214" width="24" height="24" fill="#24507F"/>
      <text x="116" y="232" font-size="18" font-weight="700" fill="#1F2A37">①取引データ_100件.csv</text>
      <text x="564" y="232" font-size="15" fill="#24507F" text-anchor="end">Shift_JIS</text>
      <text x="116" y="262" font-size="16" fill="#5D6B7A">取引 ID と、その取引の状態（完了など）</text>
    </g>
    <g id="file-pay">
      <rect x="64" y="296" width="520" height="88" rx="12" fill="#F2F6FB"/>
      <use data-icon="tabler-filled/file-text" x="84" y="314" width="24" height="24" fill="#24507F"/>
      <text x="116" y="332" font-size="18" font-weight="700" fill="#1F2A37">②決済管理データ_100件.csv</text>
      <text x="564" y="332" font-size="15" fill="#24507F" text-anchor="end">Shift_JIS</text>
      <text x="116" y="362" font-size="16" fill="#5D6B7A">オーダー ID・利用者・決済ステータス（決済済など）</text>
    </g>
    <g id="file-app">
      <rect x="64" y="396" width="520" height="88" rx="12" fill="#F2F6FB"/>
      <use data-icon="tabler-filled/file-text" x="84" y="414" width="24" height="24" fill="#24507F"/>
      <text x="116" y="432" font-size="18" font-weight="700" fill="#1F2A37">③講習受講データ_100件.xlsx</text>
      <text x="116" y="462" font-size="16" fill="#5D6B7A">申請番号ごとの申請日・有効期間・担当拠点など</text>
    </g>
    <g id="file-del">
      <rect x="64" y="496" width="520" height="88" rx="12" fill="#FFFFFF" stroke="#E2E7EC" stroke-width="1"/>
      <use data-icon="tabler-filled/trash" x="84" y="514" width="24" height="24" fill="#5D6B7A"/>
      <text x="116" y="532" font-size="18" font-weight="700" fill="#1F2A37">④処理済みデータ_100件.xlsx</text>
      <text x="564" y="532" font-size="15" fill="#24507F" text-anchor="end">シート「リスト_3」</text>
      <text x="116" y="562" font-size="16" fill="#5D6B7A">削除にだけ使う。会員番号と申請番号の組</text>
    </g>
  </g>

  <g id="update-steps" data-pptx-bounds="616 194 600 392">
    <text x="616" y="214" font-size="20" font-weight="700" fill="#24507F">サンプルの設定がする処理</text>
    <line x1="640" y1="252" x2="640" y2="492" stroke="#CFD7DE" stroke-width="2"/>
    <g id="step-join">
      <circle cx="640" cy="252" r="15" fill="#24507F"/>
      <text x="640" y="258" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
      <text x="670" y="258" font-size="18" font-weight="700" fill="#1F2A37">①と②を、ID に含まれる会員番号で結合</text>
      <text x="670" y="282" font-size="16" fill="#5D6B7A">両方にある組だけが残る</text>
    </g>
    <g id="step-judge">
      <circle cx="640" cy="332" r="15" fill="#24507F"/>
      <text x="640" y="338" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
      <text x="670" y="338" font-size="18" font-weight="700" fill="#1F2A37">①が「完了」かつ ②が「決済済」なら「済」</text>
      <text x="670" y="362" font-size="16" fill="#5D6B7A">片方でも違えば空欄のまま（画面では「未決済」）</text>
    </g>
    <g id="step-left-join">
      <circle cx="640" cy="412" r="15" fill="#24507F"/>
      <text x="640" y="418" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="670" y="418" font-size="18" font-weight="700" fill="#1F2A37">③を、②から取り出した申請番号で左結合</text>
      <text x="670" y="442" font-size="16" fill="#5D6B7A">③が無い行も残る</text>
    </g>
    <g id="step-merge">
      <circle cx="640" cy="492" r="15" fill="#24507F"/>
      <text x="640" y="498" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
      <text x="670" y="498" font-size="18" font-weight="700" fill="#1F2A37">②のオーダー ID で台帳へマージ</text>
      <text x="670" y="522" font-size="16" fill="#5D6B7A">新しい行は追加、ある行は更新、台帳だけの行は残す</text>
    </g>
    <rect x="616" y="540" width="600" height="44" rx="10" fill="#F2F6FB"/>
    <text x="640" y="569" font-size="18" fill="#1F2A37">結果: 台帳 100 件（済 80・未決済 20、③あり 80）</text>
  </g>

  <g id="search-keys" data-pptx-bounds="64 598 1152 52">
    <rect x="64" y="602" width="1152" height="44" rx="10" fill="#FFFFFF" stroke="#CFD7DE" stroke-width="1"/>
    <text x="88" y="630" font-size="16" fill="#1F2A37">この本で検索する番号: AA10000000AA（済）・UQ10005480SY（①が未完了で未決済）・ZZ20000080ZZ（③なしで済）</text>
  </g>

  <g id="page-footer" data-pptx-bounds="64 656 1152 30" data-pptx-role="footer" fill="#5D6B7A" font-size="14">
    <text x="64" y="676">P07</text>
    <text x="1216" y="676" text-anchor="end">同梱サンプルで一通り使う</text>
  </g>
</svg>
