<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <rect id="page-rule" x="0" y="0" width="1280" height="6" fill="#24507F" data-pptx-role="decoration"/>

  <g id="page-head" data-pptx-bounds="64 44 1152 140">
    <rect x="64" y="50" width="76" height="28" rx="14" fill="#24507F"/>
    <text x="102" y="69" font-size="15" fill="#FFFFFF" text-anchor="middle">手順 3</text>
    <text x="64" y="124" font-size="40" font-weight="700" fill="#1F2A37">見つからないとき、形式が違うとき</text>
    <text x="64" y="160" font-size="21" fill="#5D6B7A">番号の形式に合わない値は、検索しません。</text>
    <rect x="64" y="178" width="1152" height="1" fill="#CFD7DE"/>
  </g>

  <g id="shot-not-found" data-pptx-bounds="64 192 520 458">
    <rect x="64" y="196" width="520" height="452" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image href="../images/09-main-not-found.png" x="80" y="212" width="488" height="420.3" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g id="not-found-explained" data-pptx-bounds="616 196 600 110">
    <text x="616" y="222" font-size="18" font-weight="700" fill="#24507F">該当なし（写真は AB12345678CD）</text>
    <text x="616" y="248" font-size="16" fill="#1F2A37">表示は空のまま、決済状況は「未検索」になります。<tspan x="616" dy="24">状態欄に「見つかりません」と出ますが、このサンプル</tspan><tspan x="616" dy="22">設定では時計と同じ欄なので、1 秒ほどで時計に戻ります。</tspan></text>
  </g>

  <g id="format-error" data-pptx-bounds="616 314 600 244">
    <rect x="616" y="318" width="600" height="1" fill="#CFD7DE"/>
    <text x="616" y="352" font-size="18" font-weight="700" fill="#24507F">形式違い（写真は 12345）</text>
    <rect x="616" y="366" width="600" height="160" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image href="../images/10-key-format-error.png" x="632" y="382" width="568" height="128" preserveAspectRatio="xMidYMid meet"/>
    <text x="616" y="550" font-size="16" fill="#5D6B7A">警告「決済会員番号 が形式 … に一致しません」。検索はしません。</text>
  </g>

  <g id="pattern-note" data-pptx-bounds="616 564 600 86">
    <rect x="616" y="568" width="600" height="80" rx="10" fill="#F2F6FB"/>
    <text x="636" y="598" font-size="16" fill="#1F2A37">形式は settings.json の search.pattern（正規表現）で決まります。<tspan x="636" dy="26">サンプルは「AA10000000AA」か「東京オンAB10-20000」の形。</tspan></text>
  </g>

  <g id="page-footer" data-pptx-bounds="64 656 1152 30" data-pptx-role="footer" fill="#5D6B7A" font-size="14">
    <text x="64" y="676">P13</text>
    <text x="1216" y="676" text-anchor="end">同梱サンプルで一通り使う</text>
  </g>
</svg>
