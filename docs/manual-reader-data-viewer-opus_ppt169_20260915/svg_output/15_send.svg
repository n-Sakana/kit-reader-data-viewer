<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <rect id="page-rule" x="0" y="0" width="1280" height="6" fill="#24507F" data-pptx-role="decoration"/>

  <g id="page-head" data-pptx-bounds="42 44 1174 140">
    <rect x="64" y="50" width="76" height="28" rx="14" fill="#24507F"/>
    <text x="102" y="69" font-size="15" fill="#FFFFFF" text-anchor="middle">手順 4</text>
    <text x="42" y="124" font-size="40" font-weight="700" fill="#1F2A37">［変更をまとめて送信］で共有台帳へ書きます</text>
    <text x="64" y="160" font-size="21" fill="#5D6B7A">処理済にした行も、未処理に戻した行も、今の状態を送ります。</text>
    <rect x="64" y="178" width="1152" height="1" fill="#CFD7DE"/>
  </g>

  <g id="shot-send-confirm" data-pptx-bounds="64 192 560 236">
    <rect x="64" y="196" width="560" height="181" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image href="../images/11-send-confirm.png" x="80" y="212" width="528" height="149" preserveAspectRatio="xMidYMid meet"/>
    <text x="64" y="400" font-size="16" fill="#5D6B7A">「送信」の確認。［はい］で送ります。<tspan x="64" dy="22">撮影では、送った後に未送信が 0 件になりました。</tspan></text>
  </g>

  <g id="conflict-note" data-pptx-bounds="64 440 560 210">
    <rect x="64" y="444" width="560" height="204" rx="12" fill="#FFFFFF" stroke="#CFD7DE" stroke-width="1"/>
    <rect x="64" y="444" width="5" height="204" rx="2.5" fill="#C05B21"/>
    <text x="92" y="476" font-size="18" font-weight="700" fill="#C05B21">合わない行は、上書きしません</text>
    <text x="92" y="504" font-size="16" fill="#1F2A37">照合で、行が無い・中身が変わった・ほかの状態に<tspan x="92" dy="22">なっていた変更は、未送信のまま残します</tspan><tspan x="92" dy="22">（P21「送信できなかったレコード」）。</tspan></text>
    <text x="92" y="590" font-size="16" fill="#5D6B7A">閉じても未送信は残りますが、<tspan x="92" dy="22">別の PC へは移りません。</tspan></text>
  </g>

  <g id="send-steps" data-pptx-bounds="656 194 560 456">
    <text x="656" y="214" font-size="20" font-weight="700" fill="#24507F">送信で起きること</text>
    <line x1="680" y1="256" x2="680" y2="544" stroke="#CFD7DE" stroke-width="2"/>
    <g id="send-step-lock">
      <circle cx="680" cy="256" r="15" fill="#24507F"/>
      <text x="680" y="262" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
      <text x="710" y="262" font-size="18" font-weight="700" fill="#1F2A37">ロックを取る</text>
      <text x="710" y="288" font-size="16" fill="#5D6B7A">ほかの PC と同時に書かないようにする</text>
    </g>
    <g id="send-step-reload">
      <circle cx="680" cy="352" r="15" fill="#24507F"/>
      <text x="680" y="358" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
      <text x="710" y="358" font-size="18" font-weight="700" fill="#1F2A37">最新の共有台帳を読み直す</text>
      <text x="710" y="384" font-size="16" fill="#5D6B7A">ほかの人が書いた変更を取り込んでから書く</text>
    </g>
    <g id="send-step-check">
      <circle cx="680" cy="448" r="15" fill="#24507F"/>
      <text x="680" y="454" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="710" y="454" font-size="18" font-weight="700" fill="#1F2A37">照合する</text>
      <text x="710" y="480" font-size="16" fill="#5D6B7A">行の中身と、変更前の状態が変わっていないか</text>
    </g>
    <g id="send-step-write">
      <circle cx="680" cy="544" r="15" fill="#24507F"/>
      <text x="680" y="550" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
      <text x="710" y="550" font-size="18" font-weight="700" fill="#1F2A37">合う行だけ書き、操作ログに 1 行残す</text>
      <text x="710" y="576" font-size="16" fill="#5D6B7A">書けた行は、未送信から外れる</text>
    </g>
    <text x="656" y="632" font-size="16" fill="#5D6B7A">同じ値をもう一度送っても、二重には数えません。</text>
  </g>

  <g id="page-footer" data-pptx-bounds="64 656 1152 30" data-pptx-role="footer" fill="#5D6B7A" font-size="14">
    <text x="64" y="676">P15</text>
    <text x="1216" y="676" text-anchor="end">同梱サンプルで一通り使う</text>
  </g>
</svg>
