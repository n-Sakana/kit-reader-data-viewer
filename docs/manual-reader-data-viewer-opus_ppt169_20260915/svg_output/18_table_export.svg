<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <rect id="page-rule" x="0" y="0" width="1280" height="6" fill="#24507F" data-pptx-role="decoration"/>

  <g id="page-head" data-pptx-bounds="42 60 1174 116">
    <text x="42" y="108" font-size="40" font-weight="700" fill="#1F2A37">［帳票出力］で CSV に書き出します</text>
    <text x="64" y="148" font-size="21" fill="#5D6B7A">台帳から、選んだ項目と、条件に合う行だけを書き出します。</text>
    <rect x="64" y="168" width="1152" height="1" fill="#CFD7DE"/>
  </g>

  <g id="shot-table-export" data-pptx-bounds="64 184 532 460">
    <rect x="64" y="188" width="532" height="452" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image href="../images/13-table-export.png" x="80" y="204" width="500" height="420" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g id="export-parts" data-pptx-bounds="628 184 588 460">
    <g id="export-fields">
      <rect x="628" y="188" width="588" height="92" rx="12" fill="#F2F6FB"/>
      <text x="652" y="214" font-size="18" font-weight="700" fill="#24507F">項目を選ぶ</text>
      <text x="652" y="240" font-size="16" fill="#1F2A37">「出力できる項目」から ▶ で右へ移します。<tspan x="652" dy="22">［既定に戻す］で設定の初期項目に戻ります（写真は 11 項目）。</tspan></text>
    </g>
    <g id="export-filter">
      <rect x="628" y="292" width="588" height="92" rx="12" fill="#F2F6FB"/>
      <text x="652" y="318" font-size="18" font-weight="700" fill="#24507F">絞り込む</text>
      <text x="652" y="344" font-size="16" fill="#1F2A37">項目・条件・値を選んで［追加］。すべてに一致する行だけ出ます。<tspan x="652" dy="22">条件は 含む / 等しい / 始まる / 含まない、数値と日付は範囲。</tspan></text>
    </g>
    <g id="export-destination">
      <rect x="628" y="396" width="588" height="92" rx="12" fill="#F2F6FB"/>
      <text x="652" y="422" font-size="18" font-weight="700" fill="#24507F">出力先</text>
      <text x="652" y="448" font-size="16" fill="#1F2A37">既定は output\export-日時.csv（同じ名前には上書きしない）。<tspan x="652" dy="22" fill="#5D6B7A">撮影では 100 行・11 項目の CSV ができました。</tspan></text>
    </g>
    <g id="export-excel">
      <rect x="628" y="500" width="588" height="68" rx="12" fill="#F2F6FB"/>
      <text x="652" y="526" font-size="18" font-weight="700" fill="#24507F">Excel 向けの設定</text>
      <text x="652" y="552" font-size="16" fill="#1F2A37">数式と読まれる値の先頭にアポストロフィ（既定でオン）。</text>
    </g>
    <g id="export-scope">
      <rect x="628" y="580" width="588" height="60" rx="12" fill="#FFFFFF" stroke="#CFD7DE" stroke-width="1"/>
      <rect x="628" y="580" width="5" height="60" rx="2.5" fill="#C05B21"/>
      <text x="652" y="605" font-size="16" fill="#1F2A37">出るのは、この PC に見えている台帳と未送信の状態です。<tspan x="652" dy="24">ほかの PC の未送信は含みません。</tspan></text>
    </g>
  </g>

  <g id="page-footer" data-pptx-bounds="64 656 1152 30" data-pptx-role="footer" fill="#5D6B7A" font-size="14">
    <text x="64" y="676">P18</text>
    <text x="1216" y="676" text-anchor="end">同梱サンプルで一通り使う</text>
  </g>
</svg>
