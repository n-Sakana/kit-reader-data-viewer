<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background" />
  <rect id="page-rule" x="0" y="0" width="1280" height="6" fill="#24507F" data-pptx-role="decoration" />

  <g id="page-head" data-pptx-bounds="64 60 1152 116">
    <text x="64" y="108" font-size="40" font-weight="700" fill="#1F2A37">用意するものと、できるファイル</text>
    <text x="64" y="148" font-size="21" fill="#5D6B7A">台帳は同梱されません。最初の起動で作ります。</text>
    <rect x="64" y="168" width="1152" height="1" fill="#CFD7DE" />
  </g>

  <g id="prepare" data-pptx-bounds="64 194 520 348">
    <text x="64" y="214" font-size="20" font-weight="700" fill="#24507F">用意するもの</text>
    <rect x="64" y="232" width="520" height="306" rx="12" fill="#F2F6FB" />
    <g id="prepare-windows">
      <text x="88" y="266" font-size="18" font-weight="700" fill="#1F2A37">64 ビット Windows</text>
      <text x="88" y="290" font-size="16" fill="#5D6B7A">Windows PowerShell 5.1（.NET Framework・WPF）</text>
    </g>
    <g id="prepare-webview2">
      <text x="88" y="322" font-size="18" font-weight="700" fill="#1F2A37">WebView2 Runtime</text>
      <text x="88" y="346" font-size="16" fill="#5D6B7A">DLL は同梱。Runtime は端末に入っているもの</text>
    </g>
    <g id="prepare-app">
      <text x="88" y="378" font-size="18" font-weight="700" fill="#1F2A37">アプリ一式</text>
      <text x="88" y="402" font-size="16" fill="#5D6B7A">ReaderDataViewer.vbs・settings.json・src・web・lib</text>
    </g>
    <g id="prepare-inputs">
      <text x="88" y="434" font-size="18" font-weight="700" fill="#1F2A37">入力ファイル</text>
      <text x="88" y="458" font-size="16" fill="#5D6B7A">settings.json で決めた data フォルダに置く CSV / XLSX</text>
    </g>
    <g id="prepare-share">
      <text x="88" y="490" font-size="18" font-weight="700" fill="#1F2A37">共有フォルダ（複数の PC で使うとき）</text>
      <text x="88" y="514" font-size="16" fill="#5D6B7A">全 PC から同じパスで開ける場所</text>
    </g>
  </g>

  <g id="created-files" data-pptx-bounds="616 194 600 348">
    <text x="616" y="214" font-size="20" font-weight="700" fill="#24507F">できるファイル</text>
    <rect x="616" y="232" width="600" height="306" rx="12" fill="none" stroke="#E2E7EC" stroke-width="1" />
    <g id="files-ledger-folder">
      <use data-icon="tabler-filled/folder" x="640" y="246" width="22" height="22" fill="#24507F" />
      <text x="670" y="264" font-size="18" font-weight="700" fill="#24507F">台帳のフォルダ</text>
      <text x="670" y="290" font-size="16" fill="#1F2A37">台帳（.xlsx。アプリが持つ LEDGER シート 1 枚）<tspan x="670" dy="24">.lock と .version（書き込みの印。台帳と同じ場所に置く）</tspan><tspan x="670" dy="24">操作ログ &lt;台帳名&gt;-操作ログ-&lt;端末名&gt;.csv（1 操作 1 行）</tspan></text>
    </g>
    <g id="files-app-folder">
      <use data-icon="tabler-filled/folder" x="640" y="362" width="22" height="22" fill="#24507F" />
      <text x="670" y="380" font-size="18" font-weight="700" fill="#24507F">アプリのフォルダ</text>
      <text x="670" y="406" font-size="16" fill="#1F2A37">処理ログ（場所は settings.json の paths.log）<tspan x="670" dy="24">帳票出力の CSV（既定は output フォルダ）</tspan></text>
    </g>
    <g id="files-this-pc">
      <use data-icon="tabler-filled/device-desktop" x="640" y="454" width="22" height="22" fill="#24507F" />
      <text x="670" y="472" font-size="18" font-weight="700" fill="#24507F">この PC（%LOCALAPPDATA%\ReaderDataViewer）</text>
      <text x="670" y="498" font-size="16" fill="#1F2A37">未送信の控え pending-&lt;台帳のハッシュ&gt;.dat<tspan x="670" dy="24">問い合わせ用のログ logs\feedback.log</tspan></text>
    </g>
  </g>

  <g id="inputs-note" data-pptx-bounds="64 552 1152 86">
    <rect x="64" y="556" width="1152" height="78" rx="12" fill="#FFFFFF" stroke="#CFD7DE" stroke-width="1" />
    <rect x="64" y="556" width="5" height="78" rx="2.5" fill="#24507F" />
    <text x="92" y="588" font-size="18" font-weight="700" fill="#1F2A37">入力ファイルは読むだけです。</text>
    <text x="92" y="618" font-size="18" fill="#5D6B7A">台帳は起動時の確認か［データ更新］で作り、書き換えます。帳票出力は入力・台帳・設定へは書き出せません。</text>
  </g>

  <g id="page-footer" data-pptx-bounds="64 656 1152 30" data-pptx-role="footer" fill="#5D6B7A" font-size="14">
    <text x="64" y="676">P05</text>
    <text x="1216" y="676" text-anchor="end">このアプリがすること</text>
  </g>
</svg>
