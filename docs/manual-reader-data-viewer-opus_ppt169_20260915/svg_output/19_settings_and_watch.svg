<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <defs>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#5D6B7A"/>
    </marker>
  </defs>
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <rect id="page-rule" x="0" y="0" width="1280" height="6" fill="#24507F" data-pptx-role="decoration"/>

  <g id="page-head" data-pptx-bounds="42 60 1174 116">
    <text x="42" y="108" font-size="40" font-weight="700" fill="#1F2A37">［設定］と、ほかのアプリからの自動読み取り</text>
    <text x="64" y="148" font-size="21" fill="#5D6B7A">画面から変えられるのは、場所・検索・監視の 3 つだけです。</text>
    <rect x="64" y="168" width="1152" height="1" fill="#CFD7DE"/>
  </g>

  <g id="shot-settings" data-pptx-bounds="64 184 560 464">
    <rect x="64" y="188" width="560" height="398" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image href="../images/14-settings.png" x="80" y="204" width="528" height="365.7" preserveAspectRatio="xMidYMid meet"/>
    <text x="64" y="610" font-size="16" fill="#5D6B7A">［OK］で settings.json の paths / search / watch を<tspan x="64" dy="22">書き直します（その部分のコメントは消えます）。</tspan></text>
  </g>

  <g id="watch-flow" data-pptx-bounds="656 186 560 350">
    <text x="656" y="208" font-size="20" font-weight="700" fill="#24507F">自動読み取りの流れ</text>
    <g id="watch-node-source">
      <rect x="656" y="222" width="560" height="62" rx="12" fill="#F2F6FB"/>
      <text x="680" y="248" font-size="18" font-weight="700" fill="#1F2A37">ほかのアプリの入力欄</text>
      <text x="680" y="272" font-size="16" fill="#5D6B7A">設定した監視対象（写真の設定はメモ帳の欄）</text>
    </g>
    <line x1="936" y1="286" x2="936" y2="302" stroke="#5D6B7A" stroke-width="2" marker-end="url(#flowArrow)"/>
    <g id="watch-node-read">
      <rect x="656" y="304" width="560" height="62" rx="12" fill="#F2F6FB"/>
      <text x="680" y="330" font-size="18" font-weight="700" fill="#1F2A37">値を読み取る</text>
      <text x="680" y="354" font-size="16" fill="#5D6B7A">UI Automation で、一定の間隔で読む（写真の設定は 40ms）</text>
    </g>
    <line x1="936" y1="368" x2="936" y2="384" stroke="#5D6B7A" stroke-width="2" marker-end="url(#flowArrow)"/>
    <g id="watch-node-search">
      <rect x="656" y="386" width="560" height="62" rx="12" fill="#F2F6FB"/>
      <text x="680" y="412" font-size="18" font-weight="700" fill="#1F2A37">値が落ち着き、番号の形式に合えば検索</text>
      <text x="680" y="436" font-size="16" fill="#5D6B7A">読取値に入れて、手入力と同じように探す</text>
    </g>
    <line x1="936" y1="450" x2="936" y2="466" stroke="#5D6B7A" stroke-width="2" marker-end="url(#flowArrow)"/>
    <g id="watch-node-shown">
      <rect x="656" y="468" width="560" height="62" rx="12" fill="#F2F6FB"/>
      <text x="680" y="494" font-size="18" font-weight="700" fill="#1F2A37">1 件なら表示</text>
      <text x="680" y="518" font-size="16" fill="#5D6B7A">サンプル設定では、自動で処理済へ進む</text>
    </g>
  </g>

  <g id="watch-note" data-pptx-bounds="656 542 560 108">
    <rect x="656" y="546" width="560" height="102" rx="12" fill="#FFFFFF" stroke="#CFD7DE" stroke-width="1"/>
    <rect x="656" y="546" width="5" height="102" rx="2.5" fill="#24507F"/>
    <text x="680" y="574" font-size="16" fill="#1F2A37">監視対象は［画面から選ぶ］で、対象の欄にカーソルを合わせて<tspan x="680" dy="22">Ctrl + Shift を押して登録します。</tspan></text>
    <text x="680" y="628" font-size="16" fill="#5D6B7A">自動読み取りの実演は、この本では撮っていません。</text>
  </g>

  <g id="page-footer" data-pptx-bounds="64 656 1152 30" data-pptx-role="footer" fill="#5D6B7A" font-size="14">
    <text x="64" y="676">P19</text>
    <text x="1216" y="676" text-anchor="end">同梱サンプルで一通り使う</text>
  </g>
</svg>
