<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background" />
  <rect id="page-rule" x="0" y="0" width="1280" height="6" fill="#24507F" data-pptx-role="decoration" />

  <g id="page-head" data-pptx-bounds="64 60 1152 116">
    <text x="64" y="108" font-size="40" font-weight="700" fill="#1F2A37">主画面の見方</text>
    <text x="64" y="148" font-size="21" fill="#5D6B7A">写真は同梱サンプルの主画面です。見出しと項目は設定で決まります。</text>
    <rect x="64" y="168" width="1152" height="1" fill="#CFD7DE" />
  </g>

  <g id="main-shot" data-pptx-bounds="64 186 528 464">
    <rect x="64" y="188" width="528" height="459" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1" />
    <image href="../images/06-main-marked-done.png" x="80" y="204" width="496" height="427.2" preserveAspectRatio="xMidYMid meet" />
    <g id="main-shot-markers" stroke="#FFFFFF" stroke-width="2" fill="#24507F">
      <circle cx="120" cy="211" r="11" />
      <circle cx="142" cy="269" r="11" />
      <circle cx="131" cy="558" r="11" />
      <circle cx="297" cy="588" r="11" />
      <circle cx="139" cy="609" r="11" />
      <circle cx="288" cy="626" r="11" />
    </g>
    <g id="main-shot-marker-numbers" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">
      <text x="120" y="216">1</text>
      <text x="142" y="274">2</text>
      <text x="131" y="563">3</text>
      <text x="297" y="593">4</text>
      <text x="139" y="614">5</text>
      <text x="288" y="631">6</text>
    </g>
  </g>

  <g id="legend" data-pptx-bounds="624 190 592 420">
    <g id="legend-search">
      <circle cx="648" cy="210" r="13" fill="#24507F" />
      <text x="648" y="215" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
      <text x="674" y="216" font-size="18" font-weight="700" fill="#1F2A37">検索</text>
      <text x="674" y="240" font-size="16" fill="#5D6B7A">読取値（大きく表示）・入力欄・［検索］［クリア］<tspan x="674" dy="22">状態ボタン（未処理 / 処理済）</tspan></text>
    </g>
    <g id="legend-fields">
      <circle cx="648" cy="290" r="13" fill="#24507F" />
      <text x="648" y="295" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
      <text x="674" y="296" font-size="18" font-weight="700" fill="#1F2A37">表示欄</text>
      <text x="674" y="320" font-size="16" fill="#5D6B7A">見つかった 1 件の項目<tspan x="674" dy="22">利用者情報・申請情報・備考欄・変更内容</tspan></text>
    </g>
    <g id="legend-judgment">
      <circle cx="648" cy="370" r="13" fill="#24507F" />
      <text x="648" y="375" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="674" y="376" font-size="18" font-weight="700" fill="#1F2A37">判定の帯</text>
      <text x="674" y="400" font-size="16" fill="#5D6B7A">設定した判定の結果。写真は決済状況の「済」</text>
    </g>
    <g id="legend-buttons">
      <circle cx="648" cy="428" r="13" fill="#24507F" />
      <text x="648" y="433" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
      <text x="674" y="434" font-size="18" font-weight="700" fill="#1F2A37">操作ボタン</text>
      <text x="674" y="458" font-size="16" fill="#5D6B7A">台帳再読込・帳票出力・データ更新・データ削除・設定</text>
    </g>
    <g id="legend-sendbar">
      <circle cx="648" cy="486" r="13" fill="#24507F" />
      <text x="648" y="491" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
      <text x="674" y="492" font-size="18" font-weight="700" fill="#1F2A37">送信帯</text>
      <text x="674" y="516" font-size="16" fill="#5D6B7A">この PC の未送信件数と［変更をまとめて送信］</text>
    </g>
    <g id="legend-statusbar">
      <circle cx="648" cy="544" r="13" fill="#24507F" />
      <text x="648" y="549" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
      <text x="674" y="550" font-size="18" font-weight="700" fill="#1F2A37">状態欄</text>
      <text x="674" y="574" font-size="16" fill="#5D6B7A">アプリの状況・台帳件数・時計<tspan x="674" dy="22">写真の状況「タイトルなし - メモ帳 を待機中」は監視の待ち</tspan></text>
    </g>
  </g>

  <g id="page-footer" data-pptx-bounds="64 656 1152 30" data-pptx-role="footer" fill="#5D6B7A" font-size="14">
    <text x="64" y="676">P06</text>
    <text x="1216" y="676" text-anchor="end">このアプリがすること</text>
  </g>
</svg>
