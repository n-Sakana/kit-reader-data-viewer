<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <rect id="page-rule" x="0" y="0" width="1280" height="6" fill="#24507F" data-pptx-role="decoration"/>

  <g id="page-head" data-pptx-bounds="64 44 1152 140">
    <rect x="64" y="50" width="76" height="28" rx="14" fill="#24507F"/>
    <text x="102" y="69" font-size="15" fill="#FFFFFF" text-anchor="middle">手順 3</text>
    <text x="64" y="124" font-size="40" font-weight="700" fill="#1F2A37">2 件以上見つかったら、選びます</text>
    <text x="64" y="160" font-size="21" fill="#5D6B7A">候補一覧で選ぶまで、主画面には何も表示されません。</text>
    <rect x="64" y="178" width="1152" height="1" fill="#CFD7DE"/>
  </g>

  <g id="shot-candidates" data-pptx-bounds="64 192 1152 244">
    <rect x="64" y="196" width="1152" height="212" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image href="../images/21-candidates.png" x="80" y="212" width="1120" height="179.2" preserveAspectRatio="xMidYMid meet"/>
    <text x="64" y="430" font-size="16" fill="#5D6B7A">「該当案件」。受付番号・会員番号・管理番号・申請日・決済状況・処理の列で見分けます。</text>
  </g>

  <g id="how-to-pick" data-pptx-bounds="64 446 560 168">
    <rect x="64" y="448" width="560" height="164" rx="12" fill="#F2F6FB"/>
    <text x="88" y="480" font-size="18" font-weight="700" fill="#24507F">選び方</text>
    <text x="88" y="506" font-size="16" fill="#1F2A37">行を選んで［OK］。ダブルクリックか Enter でも決まります。<tspan x="88" dy="24">［キャンセル］なら、何も表示しません。</tspan></text>
    <text x="88" y="566" font-size="16" fill="#5D6B7A">撮影では 2 行目を選び、大阪オンBC11-20001 の<tspan x="88" dy="22">行が主画面に表示されました。</tspan></text>
  </g>

  <g id="about-this-photo" data-pptx-bounds="656 446 560 168">
    <rect x="656" y="448" width="560" height="164" rx="12" fill="#FFFFFF" stroke="#CFD7DE" stroke-width="1"/>
    <rect x="656" y="448" width="5" height="164" rx="2.5" fill="#C05B21"/>
    <text x="684" y="480" font-size="18" font-weight="700" fill="#C05B21">この写真について</text>
    <text x="684" y="506" font-size="16" fill="#1F2A37">候補を 2 件にするため、この写真だけ、台帳の 1 行の<tspan x="684" dy="24">会員番号を 1 行目と同じに書き換えました。</tspan></text>
    <text x="684" y="566" font-size="16" fill="#5D6B7A">書き換え方は tests/Test-PaymentLive.ps1 と同じです。<tspan x="684" dy="22">配布サンプルでは、1 つの番号に 1 件です。</tspan></text>
  </g>

  <g id="page-footer" data-pptx-bounds="64 656 1152 30" data-pptx-role="footer" fill="#5D6B7A" font-size="14">
    <text x="64" y="676">P12</text>
    <text x="1216" y="676" text-anchor="end">同梱サンプルで一通り使う</text>
  </g>
</svg>
