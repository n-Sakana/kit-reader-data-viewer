<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <rect id="page-rule" x="0" y="0" width="1280" height="6" fill="#24507F" data-pptx-role="decoration"/>

  <g id="page-head" data-pptx-bounds="42 44 1174 140">
    <rect x="64" y="50" width="76" height="28" rx="14" fill="#24507F"/>
    <text x="102" y="69" font-size="15" fill="#FFFFFF" text-anchor="middle">手順 2</text>
    <text x="42" y="124" font-size="40" font-weight="700" fill="#1F2A37">［データ更新］で取り込みます</text>
    <text x="64" y="160" font-size="21" fill="#5D6B7A">何を読み、どう処理し、どこへ書くかを、実行前に確かめられます。</text>
    <rect x="64" y="178" width="1152" height="1" fill="#CFD7DE"/>
  </g>

  <g id="shot-update-dialog" data-pptx-bounds="64 192 647 458">
    <rect x="64" y="196" width="647" height="452" rx="12" fill="#FAFBFC" stroke="#E2E7EC" stroke-width="1"/>
    <image href="../images/03-update-dialog.png" x="80" y="212" width="615" height="420" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g id="dialog-parts" data-pptx-bounds="743 192 473 458">
    <g id="part-inputs">
      <rect x="743" y="196" width="473" height="104" rx="12" fill="#F2F6FB"/>
      <text x="767" y="226" font-size="18" font-weight="700" fill="#24507F">取り込むデータ</text>
      <text x="767" y="252" font-size="16" fill="#1F2A37">設定された表・ファイル・キー・行数と、<tspan x="767" dy="22">見出しの検証（列一致 / ファイルなし / 不一致）</tspan></text>
    </g>
    <g id="part-steps">
      <rect x="743" y="312" width="473" height="104" rx="12" fill="#F2F6FB"/>
      <text x="767" y="342" font-size="18" font-weight="700" fill="#24507F">処理内容</text>
      <text x="767" y="368" font-size="16" fill="#1F2A37">設定の手順を、上から順に表示します。<tspan x="767" dy="22">操作・対象・キー・条件・出力（写真は 11 段）</tspan></text>
    </g>
    <g id="part-output">
      <rect x="743" y="428" width="473" height="80" rx="12" fill="#F2F6FB"/>
      <text x="767" y="458" font-size="18" font-weight="700" fill="#24507F">書き出し先</text>
      <text x="767" y="484" font-size="16" fill="#1F2A37">台帳のパス・ファイル名・最終更新</text>
    </g>
    <g id="part-execute">
      <rect x="743" y="520" width="473" height="128" rx="12" fill="#FFFFFF" stroke="#CFD7DE" stroke-width="1"/>
      <rect x="743" y="520" width="5" height="128" rx="2.5" fill="#24507F"/>
      <text x="767" y="548" font-size="16" font-weight="700" fill="#1F2A37">［実行］すると</text>
      <text x="767" y="572" font-size="16" fill="#1F2A37">入力と台帳を比べ、差があれば「更新の確認」、<tspan x="767" dy="22">なければ「更新はありません (台帳は最新です)」。</tspan></text>
      <text x="767" y="626" font-size="16" fill="#5D6B7A">手順の変更は settings.json で行います。</text>
    </g>
  </g>

  <g id="page-footer" data-pptx-bounds="64 656 1152 30" data-pptx-role="footer" fill="#5D6B7A" font-size="14">
    <text x="64" y="676">P09</text>
    <text x="1216" y="676" text-anchor="end">同梱サンプルで一通り使う</text>
  </g>
</svg>
