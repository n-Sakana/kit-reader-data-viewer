  <g id="screens-left" data-pptx-bounds="64 334 560 304">
    <rect x="64" y="338" width="560" height="1" fill="#CFD7DE" />
    <text x="64" y="372" font-size="18" font-weight="700" fill="#1F2A37">主画面</text>
    <text x="624" y="372" text-anchor="end" font-size="15" fill="#24507F">P06</text>
    <text x="64" y="396" font-size="16" fill="#5D6B7A">検索・表示・処理済・送信をする</text>
    <text x="64" y="430" font-size="18" font-weight="700" fill="#1F2A37">更新の確認</text>
    <text x="624" y="430" text-anchor="end" font-size="15" fill="#24507F">P08・P16</text>
    <text x="64" y="454" font-size="16" fill="#5D6B7A">台帳を作る・書き換える前に出る</text>
    <text x="64" y="488" font-size="18" font-weight="700" fill="#1F2A37">レコード更新</text>
    <text x="624" y="488" text-anchor="end" font-size="15" fill="#24507F">P09</text>
    <text x="64" y="512" font-size="16" fill="#5D6B7A">［データ更新］で開く</text>
    <text x="64" y="546" font-size="18" font-weight="700" fill="#1F2A37">該当案件（候補一覧）</text>
    <text x="624" y="546" text-anchor="end" font-size="15" fill="#24507F">P12</text>
    <text x="64" y="570" font-size="16" fill="#5D6B7A">検索で 2 件以上見つかったときに出る</text>
    <text x="64" y="604" font-size="18" font-weight="700" fill="#1F2A37">送信</text>
    <text x="624" y="604" text-anchor="end" font-size="15" fill="#24507F">P15</text>
    <text x="64" y="628" font-size="16" fill="#5D6B7A">［変更をまとめて送信］で出る</text>
  </g>

  <g id="screens-right" data-pptx-bounds="656 334 560 304">
    <rect x="656" y="338" width="560" height="1" fill="#CFD7DE" />
    <text x="656" y="372" font-size="18" font-weight="700" fill="#1F2A37">台帳の更新</text>
    <text x="1216" y="372" text-anchor="end" font-size="15" fill="#24507F">P16</text>
    <text x="656" y="396" font-size="16" fill="#5D6B7A">未処理に戻った行や、ほかの PC の変更を知らせる</text>
    <text x="656" y="430" font-size="18" font-weight="700" fill="#1F2A37">レコード削除</text>
    <text x="1216" y="430" text-anchor="end" font-size="15" fill="#24507F">P17</text>
    <text x="656" y="454" font-size="16" fill="#5D6B7A">［データ削除］で開く</text>
    <text x="656" y="488" font-size="18" font-weight="700" fill="#1F2A37">テーブル出力</text>
    <text x="1216" y="488" text-anchor="end" font-size="15" fill="#24507F">P18</text>
    <text x="656" y="512" font-size="16" fill="#5D6B7A">［帳票出力］で開く</text>
    <text x="656" y="546" font-size="18" font-weight="700" fill="#1F2A37">設定・画面から選ぶ</text>
    <text x="1216" y="546" text-anchor="end" font-size="15" fill="#24507F">P19</text>
    <text x="656" y="570" font-size="16" fill="#5D6B7A">［設定］で開く</text>
    <text x="656" y="604" font-size="18" font-weight="700" fill="#1F2A37">送信できなかったレコード・データを読めません</text>
    <text x="1216" y="604" text-anchor="end" font-size="15" fill="#24507F">P21</text>
    <text x="656" y="628" font-size="16" fill="#5D6B7A">困ったときに出る</text>
  </g>

  <g id="page-footer" data-pptx-bounds="64 656 1152 30" data-pptx-role="footer" fill="#5D6B7A" font-size="14">
    <text x="64" y="676">P04</text>
    <text x="1216" y="676" text-anchor="end">このアプリがすること</text>
  </g>
