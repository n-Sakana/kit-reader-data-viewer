    <g id="flow-labels" text-anchor="middle">
      <g id="stage-1-label" fill="#FFFFFF">
        <text x="174" y="219" font-size="15">手順 1</text>
        <text font-size="18" font-weight="700" x="174" y="245">入力ファイルを</text><text font-size="18" font-weight="700" x="174" y="269">置く</text></g>
      <g id="stage-2-label" fill="#FFFFFF">
        <text x="414" y="219" font-size="15">手順 2</text>
        <text font-size="18" font-weight="700" x="414" y="245">データ更新で</text><text font-size="18" font-weight="700" x="414" y="269">台帳を作る</text></g>
      <g id="stage-3-label" fill="#FFFFFF">
        <text x="640" y="219" font-size="15">手順 3</text>
        <text font-size="18" font-weight="700" x="640" y="245">番号で検索して</text><text font-size="18" font-weight="700" x="640" y="269">確かめる</text></g>
      <g id="stage-4-label" fill="#FFFFFF">
        <text x="866" y="219" font-size="15">手順 4</text>
        <text font-size="18" font-weight="700" x="866" y="245">処理済にして</text><text font-size="18" font-weight="700" x="866" y="269">送信する</text></g>
