</g>
<g id="p04-stage-2" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="289.84 192 248.64 96" data-pptx-av-adj="val 30000" fill="#2B5C96" stroke="none">
<path d="M 289.84 192 L 509.68 192 L 538.48 240 L 509.68 288 L 289.84 288 L 318.64 240 Z" />
</g>
<g id="p04-stage-3" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="515.68 192 248.64 96" data-pptx-av-adj="val 30000" fill="#24507F" stroke="none">
