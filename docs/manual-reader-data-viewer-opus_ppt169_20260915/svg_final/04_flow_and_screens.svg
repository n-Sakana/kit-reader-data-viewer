<g id="p04-stage-4" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="741.52 192 248.64 96" data-pptx-av-adj="val 30000" fill="#2B5C96" stroke="none">
<path d="M 741.52 192 L 961.36 192 L 990.16 240 L 961.36 288 L 741.52 288 L 770.32 240 Z" />
</g>
<g id="p04-stage-5" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="967.36 192 248.64 96" data-pptx-av-adj="val 30000" fill="#FFFFFF" stroke="#24507F" stroke-width="2">
<path d="M 967.36 192 L 1187.2 192 L 1216 240 L 1187.2 288 L 967.36 288 L 996.16 240 Z" />
