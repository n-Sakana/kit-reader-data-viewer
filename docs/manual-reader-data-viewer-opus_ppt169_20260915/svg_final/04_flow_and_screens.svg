        <text font-size="18" font-weight="700" x="1092" y="245">処理済の行を</text><text font-size="18" font-weight="700" x="1092" y="269">削除する</text></g>
      <g id="stage-pages" fill="#5D6B7A" font-size="15">
        <text x="174" y="314">P07</text>
        <text x="414" y="314">P08–P09</text>
        <text x="640" y="314">P10–P13</text>
        <text x="866" y="314">P14–P16</text>
        <text x="1092" y="314">P17</text>
