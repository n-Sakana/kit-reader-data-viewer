<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background" />
  <rect id="page-rule" x="0" y="0" width="1280" height="6" fill="#24507F" data-pptx-role="decoration" />

  <g id="page-head" data-pptx-bounds="64 60 1152 116">
    <text x="64" y="108" font-size="40" font-weight="700" fill="#1F2A37">困ったとき</text>
    <text x="64" y="148" font-size="21" fill="#5D6B7A">理由はダイアログかログに出ます。問い合わせには、ログを付けます。</text>
    <rect x="64" y="168" width="1152" height="1" fill="#CFD7DE" />
  </g>

  <g id="trouble-start" data-pptx-bounds="64 186 560 132">
    <rect x="64" y="188" width="560" height="128" rx="12" fill="#F2F6FB" />
    <rect x="64" y="188" width="5" height="128" rx="2.5" fill="#2B5C96" />
    <text x="88" y="222" font-size="18" font-weight="700" fill="#1F2A37">起動しない</text>
    <text font-size="16" fill="#1F2A37" x="88" y="250">WebView2 Runtime が入っているか確かめます。</text><text font-size="16" fill="#1F2A37" x="88" y="274">ReaderDataViewer.cmd で起動すると、理由が読めます。</text></g>

  <g id="trouble-data" data-pptx-bounds="656 186 560 132">
    <rect x="656" y="188" width="560" height="128" rx="12" fill="#F2F6FB" />
    <rect x="656" y="188" width="5" height="128" rx="2.5" fill="#2B5C96" />
    <text x="680" y="222" font-size="18" font-weight="700" fill="#1F2A37">「データを読めません」</text>
    <text font-size="16" fill="#1F2A37" x="680" y="250">入力ファイルか設定に問題があり、続けられません。</text><text font-size="16" fill="#1F2A37" x="680" y="274">表示された理由を直して、起動し直します。</text></g>

  <g id="trouble-running" data-pptx-bounds="64 326 560 132">
    <rect x="64" y="328" width="560" height="128" rx="12" fill="#F2F6FB" />
    <rect x="64" y="328" width="5" height="128" rx="2.5" fill="#2B5C96" />
    <text x="88" y="362" font-size="18" font-weight="700" fill="#1F2A37">「…すでに起動しています。」</text>
    <text font-size="16" fill="#1F2A37" x="88" y="390">同じ統合台帳を開いている Reader Data Viewer が、</text><text font-size="16" fill="#1F2A37" x="88" y="414">この PC ですでに動いています。</text></g>

  <g id="trouble-lock" data-pptx-bounds="656 326 560 132">
    <rect x="656" y="328" width="560" height="128" rx="12" fill="#F2F6FB" />
    <rect x="656" y="328" width="5" height="128" rx="2.5" fill="#2B5C96" />
    <text x="680" y="362" font-size="18" font-weight="700" fill="#1F2A37">「…台帳を使用しています。空くまで待ちます。」</text>
    <text font-size="16" fill="#1F2A37" x="680" y="390">ほかの人が台帳を使っています（書き込み中）。</text><text font-size="16" fill="#1F2A37" x="680" y="414">空くと、待っていた操作が続きます。</text></g>

  <g id="trouble-unmatched" data-pptx-bounds="64 466 560 132">
    <rect x="64" y="468" width="560" height="128" rx="12" fill="#F2F6FB" />
    <rect x="64" y="468" width="5" height="128" rx="2.5" fill="#2B5C96" />
    <text x="88" y="502" font-size="18" font-weight="700" fill="#1F2A37">「送信できなかったレコード」</text>
    <text font-size="16" fill="#1F2A37" x="88" y="530">行が無い・中身が変わった変更は、未送信に残ります。</text><text font-size="16" fill="#1F2A37" x="88" y="554">［一覧の未送信変更を破棄］は、確認とバックアップ付き。</text></g>

  <g id="trouble-reset" data-pptx-bounds="656 466 560 132">
    <rect x="656" y="468" width="560" height="128" rx="12" fill="#F2F6FB" />
    <rect x="656" y="468" width="5" height="128" rx="2.5" fill="#2B5C96" />
    <text x="680" y="502" font-size="18" font-weight="700" fill="#1F2A37">処理済にした行が、未処理に戻った</text>
    <text font-size="16" fill="#1F2A37" x="680" y="530">保存する入力の列が変わった行です（P16）。</text><text font-size="16" fill="#1F2A37" x="680" y="554">内容を確かめ直してから、印を付け直します。</text></g>

  <g id="contact-log" data-pptx-bounds="64 606 1152 44">
    <rect x="64" y="610" width="1152" height="38" rx="10" fill="#FFFFFF" stroke="#CFD7DE" stroke-width="1" />
    
  <g transform="translate(80, 618) scale(0.916667)" fill="#24507F">
    <path d="M12 2c5.523 0 10 4.477 10 10a10 10 0 0 1 -19.995 .324l-.005 -.324l.004 -.28c.148 -5.393 4.566 -9.72 9.996 -9.72zm0 13a1 1 0 0 0 -.993 .883l-.007 .117l.007 .127a1 1 0 0 0 1.986 0l.007 -.117l-.007 -.127a1 1 0 0 0 -.993 -.883zm1.368 -6.673a2.98 2.98 0 0 0 -3.631 .728a1 1 0 0 0 1.44 1.383l.171 -.18a.98 .98 0 0 1 1.11 -.15a1 1 0 0 1 -.34 1.886l-.232 .012a1 1 0 0 0 .111 1.994a3 3 0 0 0 1.371 -5.673z" />
  </g>
    <text x="112" y="635" font-size="16" fill="#1F2A37">問い合わせ: %LOCALAPPDATA%\ReaderDataViewer\logs\feedback.log の、その回の BEGIN から END までを渡します。</text>
  </g>

  <g id="page-footer" data-pptx-bounds="64 656 1152 30" data-pptx-role="footer" fill="#5D6B7A" font-size="14">
    <text x="64" y="676">P21</text>
    <text x="1216" y="676" text-anchor="end">複数の PC で使う・困ったとき</text>
  </g>
</svg>