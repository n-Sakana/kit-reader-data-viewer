<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <defs>
    <marker id="writeArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#24507F" />
    </marker>
    <marker id="readArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#5D6B7A" />
    </marker>
  </defs>
  <rect id="page-bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background" />
  <rect id="page-rule" x="0" y="0" width="1280" height="6" fill="#24507F" data-pptx-role="decoration" />

  <g id="page-head" data-pptx-bounds="64 60 1152 116">
    <text x="64" y="108" font-size="40" font-weight="700" fill="#1F2A37">複数の PC で同じ台帳を使います</text>
    <text x="64" y="148" font-size="21" fill="#5D6B7A">共有するのは台帳だけ。アプリと未送信の控えは PC ごとです。</text>
    <rect x="64" y="168" width="1152" height="1" fill="#CFD7DE" />
  </g>

  <g id="share-diagram" data-pptx-bounds="64 190 1152 232">
    <g id="pc-a">
      <rect x="64" y="196" width="272" height="160" rx="12" fill="#F2F6FB" />
      
  <g transform="translate(84, 210)" fill="#24507F">
    <path d="M7 21a1 1 0 0 1 0 -2h1v-2h-4a2 2 0 0 1 -2 -2v-10a2 2 0 0 1 2 -2h16a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-4v2h1a1 1 0 0 1 0 2zm7 -4h-4v2h4z" />
  </g>
      <text x="116" y="230" font-size="18" font-weight="700" fill="#1F2A37">PC A</text>
      <text font-size="16" fill="#1F2A37" x="84" y="264">アプリ一式・settings.json</text><text font-size="16" fill="#1F2A37" x="84" y="290">未送信の控え</text><text font-size="16" fill="#1F2A37" x="84" y="316">処理ログ・feedback.log</text></g>
    <g id="shared-folder">
      <rect x="440" y="196" width="400" height="160" rx="12" fill="#FFFFFF" stroke="#24507F" stroke-width="2" />
      
  <g transform="translate(460, 210)" fill="#24507F">
    <path d="M9 3a1 1 0 0 1 .608 .206l.1 .087l2.706 2.707h6.586a3 3 0 0 1 2.995 2.824l.005 .176v8a3 3 0 0 1 -2.824 2.995l-.176 .005h-14a3 3 0 0 1 -2.995 -2.824l-.005 -.176v-11a3 3 0 0 1 2.824 -2.995l.176 -.005h4z" />
  </g>
      <text x="492" y="230" font-size="18" font-weight="700" fill="#24507F">共有フォルダ</text>
      <text font-size="16" fill="#1F2A37" x="460" y="264">台帳（.xlsx）</text><text font-size="16" fill="#1F2A37" x="460" y="290">.lock と .version</text><text font-size="16" fill="#1F2A37" x="460" y="316">操作ログ-&lt;端末名&gt;.csv（PC ごと）</text></g>
    <g id="pc-b">
      <rect x="944" y="196" width="272" height="160" rx="12" fill="#F2F6FB" />
      
  <g transform="translate(964, 210)" fill="#24507F">
    <path d="M7 21a1 1 0 0 1 0 -2h1v-2h-4a2 2 0 0 1 -2 -2v-10a2 2 0 0 1 2 -2h16a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-4v2h1a1 1 0 0 1 0 2zm7 -4h-4v2h4z" />
  </g>
      <text x="996" y="230" font-size="18" font-weight="700" fill="#1F2A37">PC B</text>
      <text font-size="16" fill="#1F2A37" x="964" y="264">アプリ一式・settings.json</text><text font-size="16" fill="#1F2A37" x="964" y="290">未送信の控え</text><text font-size="16" fill="#1F2A37" x="964" y="316">処理ログ・feedback.log</text></g>
    <g id="links-a">
      <line x1="344" y1="258" x2="430" y2="258" stroke="#24507F" stroke-width="2" marker-end="url(#writeArrow)" />
      <text x="388" y="248" font-size="15" fill="#24507F" text-anchor="middle">書く</text>
      <line x1="430" y1="302" x2="346" y2="302" stroke="#5D6B7A" stroke-width="2" marker-end="url(#readArrow)" />
      <text x="388" y="324" font-size="15" fill="#5D6B7A" text-anchor="middle">読み直す</text>
    </g>
    <g id="links-b">
      <line x1="936" y1="258" x2="850" y2="258" stroke="#24507F" stroke-width="2" marker-end="url(#writeArrow)" />
      <text x="892" y="248" font-size="15" fill="#24507F" text-anchor="middle">書く</text>
      <line x1="850" y1="302" x2="934" y2="302" stroke="#5D6B7A" stroke-width="2" marker-end="url(#readArrow)" />
      <text x="892" y="324" font-size="15" fill="#5D6B7A" text-anchor="middle">読み直す</text>
    </g>
    <text x="64" y="392" font-size="16" fill="#5D6B7A">書く = 送信・データ更新・データ削除（必ずロックの中で）　読み直す = ほかの PC が書いた変更を取り込む</text>
  </g>

  <g id="share-rules" data-pptx-bounds="64 426 1152 170">
    <g id="rule-bullets">
      <circle cx="72" cy="444" r="3.5" fill="#24507F" />
      <circle cx="72" cy="476" r="3.5" fill="#24507F" />
      <circle cx="72" cy="508" r="3.5" fill="#24507F" />
      <circle cx="72" cy="540" r="3.5" fill="#24507F" />
      <circle cx="72" cy="572" r="3.5" fill="#C05B21" />
    </g>
    <g id="rule-texts" fill="#1F2A37" font-size="18">
      <text x="88" y="450">全 PC から同じパスで開きます。ドライブ文字と UNC の混在や、別名は避けます。</text>
      <text x="88" y="482">書くときは必ずロックを取り、最新の台帳を読み直してから書きます。</text>
      <text x="88" y="514">同じ行を別の状態へ送ると、後から送った側は上書きせず、未送信に残ります。</text>
      <text x="88" y="546">ほかの PC の変更は読み直して表示に反映。中身が変わっていれば、確かめてから切り替えます。</text>
      <text x="88" y="578">OneDrive などの同期コピーや、Excel での同時編集は<tspan fill="#C05B21" font-weight="700">使いません</tspan>。</text>
    </g>
  </g>

  <g id="share-evidence" data-pptx-bounds="64 604 1152 40">
    <text x="64" y="630" font-size="14" fill="#5D6B7A">2026-09-09 に 2 台の実機から、試験用の共有へ同時に送信する試験をしています（docs/shared-ledger.md）。この本の撮影は 1 台です。</text>
  </g>

  <g id="page-footer" data-pptx-bounds="64 656 1152 30" data-pptx-role="footer" fill="#5D6B7A" font-size="14">
    <text x="64" y="676">P20</text>
    <text x="1216" y="676" text-anchor="end">複数の PC で使う・困ったとき</text>
  </g>
</svg>