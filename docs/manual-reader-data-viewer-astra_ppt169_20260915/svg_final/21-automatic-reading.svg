<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" />
  <g id="heading" data-pptx-bounds="64 36 1152 98" font-weight="bold"><text x="64" y="58" font-size="18" fill="#C05B21">03　更新・削除・共有　／　自動読取の仕組み</text><text x="64" y="112" font-size="40" fill="#24507F">自動読取は、別アプリの入力欄を見張る</text></g>
  <g id="watch-flow" data-pptx-bounds="64 184 1152 253">
    <line x1="280" y1="289" x2="1040" y2="289" stroke="#CFD7DE" stroke-width="3" />
    <g id="watch-target"><rect x="64" y="184" width="350" height="253" rx="12" fill="#F2F6FB" /><text x="90" y="226" font-size="26" fill="#C05B21" font-weight="bold">01　対象欄を選ぶ</text><text font-size="22" fill="#1F2A37" x="90" y="286">設定の［画面から選ぶ］で、</text><text font-size="22" fill="#1F2A37" x="90" y="320">実際に使うアプリの欄を</text><text font-size="22" fill="#1F2A37" x="90" y="354">指定します。</text><text x="90" y="405" font-size="18" fill="#5D6B7A">機器そのものに接続する機能ではない</text></g>
    <g id="detect-value"><rect x="465" y="184" width="350" height="253" rx="12" fill="#F2F6FB" /><text x="491" y="226" font-size="26" fill="#C05B21" font-weight="bold">02　番号を検知する</text><text font-size="22" fill="#1F2A37" x="491" y="286">対象欄にある有効な値を読み、</text><text font-size="22" fill="#1F2A37" x="491" y="320">台帳を検索します。</text><text x="491" y="405" font-size="18" fill="#5D6B7A">対象が公開する情報を利用</text></g>
    <g id="confirm-detected"><rect x="866" y="184" width="350" height="253" rx="12" fill="#24507F" /><text x="892" y="226" font-size="26" fill="#FFFFFF" font-weight="bold">03　対象を確定する</text><text font-size="22" fill="#FFFFFF" x="892" y="286">複数なら、人が選びます。</text><text font-size="22" fill="#FFFFFF" x="892" y="320">自動の状態変更は、対象が</text><text font-size="22" fill="#FFFFFF" x="892" y="354">確定してから行います。</text><text x="892" y="405" font-size="18" fill="#FFFFFF">状態変更は設定による</text></g>
  </g>
  <g id="automatic-rule" data-pptx-bounds="64 484 1152 150"><text x="64" y="517" font-size="26" fill="#24507F" font-weight="bold">自動で状態を変える設定は、監視からの検索にだけ働きます。</text><text x="64" y="565" font-size="22" fill="#1F2A37">手入力の検索は対象外です。対象アプリごとに、実際の窓で読み取りを確認してください。</text><text x="64" y="616" font-size="18" fill="#5D6B7A">このページは設定・README・コードに基づく仕組みの説明です。本書制作では外部欄の読取を実演していません。</text></g>
  <g id="footer" data-pptx-bounds="64 664 1152 26" fill="#5D6B7A" font-size="14"><text x="64" y="682">出典：README「表示・監視・省略値」、K216、Rdv3App.SearchJob / AutoCompleteDetected</text><text x="1216" y="682" text-anchor="end">21 / 24</text></g>
</svg>