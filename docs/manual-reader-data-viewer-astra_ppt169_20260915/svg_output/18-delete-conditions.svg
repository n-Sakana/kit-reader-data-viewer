<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" />
  <g id="heading" data-pptx-bounds="64 36 1152 98" font-weight="bold"><text x="64" y="58" font-size="18" fill="#C05B21">03　更新・削除・共有　／　削除する前に</text><text x="64" y="112" font-size="40" fill="#24507F">削除は「2項目の組一致」と「送信済み処理済」</text></g>
  <g id="delete-screen" data-pptx-bounds="64 183 690 459"><image href="../images/18-delete.png" x="64" y="186" width="680" height="415.77" preserveAspectRatio="xMidYMid meet" /><text x="64" y="629" font-size="16" fill="#5D6B7A">④の削除用入力と、共有台帳の保存済み状態で判定</text></g>
  <g id="delete-rules" data-pptx-bounds="792 174 424 340"><text x="792" y="206" font-size="26" fill="#24507F" font-weight="bold">両方が必要です</text><text x="792" y="263" font-size="22" fill="#C05B21" font-weight="bold">1　会員番号＋申請番号が一致</text><text x="792" y="302" font-size="22" fill="#1F2A37">④の同じ行にある2項目の組で<tspan x="792" dy="34">台帳と照合します。</tspan></text><text x="792" y="401" font-size="22" fill="#C05B21" font-weight="bold">2　共有へ保存済みの処理済</text><text x="792" y="440" font-size="22" fill="#1F2A37">手元で処理済にしただけでは、<tspan x="792" dy="34">まだ削除の対象になりません。</tspan></text></g>
  <g id="delete-scope" data-pptx-bounds="792 536 424 116"><rect x="792" y="536" width="424" height="116" rx="12" fill="#F2F6FB" /><text x="816" y="568" font-size="18" fill="#C05B21" font-weight="bold">検索中の1件だけを消すボタンでは<tspan x="816" dy="26">ありません。</tspan></text><text x="816" y="633" font-size="18" fill="#1F2A37">条件に合う行すべてが対象です。</text></g>
  <g id="footer" data-pptx-bounds="64 664 1152 26" fill="#5D6B7A" font-size="14"><text x="64" y="682">出典：PAYMENT-GUIDE「削除の条件」　／　実画面：削除・未送信状態での削除は0件</text><text x="1216" y="682" text-anchor="end">18 / 24</text></g>
</svg>
