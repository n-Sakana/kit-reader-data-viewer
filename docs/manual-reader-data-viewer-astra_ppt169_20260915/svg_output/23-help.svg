  <rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" />
  <g id="heading" data-pptx-bounds="64 36 1152 98" font-weight="bold"><text x="64" y="58" font-size="18" fill="#C05B21">03　更新・削除・共有　／　困ったとき</text><text x="64" y="112" font-size="40" fill="#24507F">見つからない・送れないときは、状況を残す</text></g>
  <g id="help-instructions" data-pptx-bounds="64 169 584 307"><text x="64" y="202" font-size="26" fill="#C05B21" font-weight="bold">番号が見つからない</text><text x="64" y="247" font-size="22" fill="#1F2A37">入力した番号と、読み込んだ台帳を確認します。<tspan x="64" dy="34">お知らせは画面の最下段に出ます。</tspan></text><text x="64" y="346" font-size="26" fill="#C05B21" font-weight="bold">変更を送信できない</text><text x="64" y="391" font-size="22" fill="#1F2A37">共有先への接続と、使用中のExcelを確認。<tspan x="64" dy="34">未送信件数と、画面に出た理由を控えます。</tspan></text></g>
  <g id="log-location" data-pptx-bounds="64 506 620 148"><rect x="64" y="506" width="620" height="148" rx="12" fill="#F2F6FB" /><text x="86" y="540" font-size="22" fill="#24507F" font-weight="bold">担当者へ、操作・番号・時刻・ログを渡す</text><text x="86" y="580" font-family="Consolas,monospace" font-size="18" fill="#1F2A37">%LOCALAPPDATA%\ReaderDataViewer\logs\feedback.log</text><text x="86" y="615" font-size="16" fill="#5D6B7A">書けない場合は %TEMP% 内の同じ場所。該当実行のBEGIN〜ENDを含めます。<tspan x="86" dy="25">ログにはパスや値が入るため、共有範囲を確認してください。</tspan></text></g>
