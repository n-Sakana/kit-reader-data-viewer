<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" />
  <g id="heading" data-pptx-bounds="64 36 1152 98" font-weight="bold"><text x="64" y="58" font-size="18" fill="#C05B21">03　更新・削除・共有　／　次の入力に更新する</text><text x="64" y="112" font-size="40" fill="#24507F">入力を差し替えたら、更新内容を確認する</text></g>
  <g id="update-confirm-screen" data-pptx-bounds="64 172 817 253"><text x="64" y="201" font-size="18" fill="#5D6B7A">入力と台帳の内容に差があるときの確認</text><image href="../images/20-update-confirm.png" x="64" y="224" width="800" height="193.27" preserveAspectRatio="xMidYMid meet" /></g>
  <g id="update-steps" data-pptx-bounds="922 173 294 244"><text x="922" y="205" font-size="26" fill="#24507F" font-weight="bold">更新の入口</text><text x="922" y="257" font-size="22" fill="#1F2A37">［データ更新］から、<tspan x="922" dy="34">入力・処理・保存先を</tspan><tspan x="922" dy="34">確認して実行します。</tspan></text><text x="922" y="379" font-size="18" fill="#5D6B7A">起動時にも更新を確認します。</text></g>
  <g id="merge-rules" data-pptx-bounds="64 466 714 179"><text x="64" y="500" font-size="26" fill="#24507F" font-weight="bold">このサンプルのマージ規則</text><text x="64" y="550" font-size="22" fill="#1F2A37">新しい行は追加。同じ識別キーの行は内容を更新。<tspan x="64" dy="34">今回の入力結果にない既存行は、残します。</tspan><tspan x="64" dy="34">元データの内容が変わった行は、未処理へ戻します。</tspan></text></g>
  <g id="update-limit" data-pptx-bounds="834 466 382 175"><rect x="834" y="466" width="382" height="175" rx="12" fill="#F2F6FB" /><text x="858" y="505" font-size="22" fill="#C05B21" font-weight="bold">送信済みでも再確認が必要</text><text x="858" y="550" font-size="18" fill="#1F2A37">送信済み行の内容を再取込から<tspan x="858" dy="30">保護する機能は、この対象版には</tspan><tspan x="858" dy="30">含まれていません。</tspan></text></g>
  <g id="footer" data-pptx-bounds="64 664 1152 26" fill="#5D6B7A" font-size="14"><text x="64" y="682">出典：PAYMENT-GUIDE「既存台帳と残る改定範囲」　／　実画面：説明用台帳への更新確認</text><text x="1216" y="682" text-anchor="end">17 / 24</text></g>
