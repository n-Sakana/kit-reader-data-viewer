<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="toc" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" />
  <g id="heading" data-pptx-bounds="64 36 1152 98" font-weight="bold"><text x="64" y="58" font-size="18" fill="#C05B21">この説明書の読み方</text><text x="64" y="112" font-size="40" fill="#24507F">まず1件を送り、次に運用を覚える</text></g>
  <g id="chapter-one" data-pptx-bounds="64 178 357 335"><rect x="64" y="178" width="357" height="335" rx="12" fill="#F2F6FB" /><text x="92" y="244" font-size="54" fill="#C05B21" font-weight="bold">01</text><text x="92" y="307" font-size="30" fill="#24507F" font-weight="bold">準備と台帳作成</text><text x="92" y="366" font-size="22" fill="#1F2A37">ZIPを展開する。<tspan x="92" dy="34">サンプルの台帳を作り、</tspan><tspan x="92" dy="34">主画面の見方を覚える。</tspan></text><text x="92" y="482" font-size="18" fill="#2B5C96" font-weight="bold">P04–07</text></g>
  <g id="chapter-two" data-pptx-bounds="461 178 357 335"><rect x="461" y="178" width="357" height="335" rx="12" fill="#F2F6FB" /><text x="489" y="244" font-size="54" fill="#C05B21" font-weight="bold">02</text><text x="489" y="307" font-size="30" fill="#24507F" font-weight="bold">検索・確認・送信</text><text x="489" y="366" font-size="22" fill="#1F2A37">対象を探し、内容を見る。<tspan x="489" dy="34">状態を付けて共有し、</tspan><tspan x="489" dy="34">必要な一覧を出力する。</tspan></text><text x="489" y="482" font-size="18" fill="#2B5C96" font-weight="bold">P08–16</text></g>
  <g id="chapter-three" data-pptx-bounds="858 178 358 335"><rect x="858" y="178" width="358" height="335" rx="12" fill="#F2F6FB" /><text x="886" y="244" font-size="54" fill="#C05B21" font-weight="bold">03</text><text x="886" y="307" font-size="30" fill="#24507F" font-weight="bold">更新・削除・共有</text><text x="886" y="366" font-size="22" fill="#1F2A37">入力を更新する。<tspan x="886" dy="34">削除と複数PCの仕組み、</tspan><tspan x="886" dy="34">困ったときの伝え方を知る。</tspan></text><text x="886" y="482" font-size="18" fill="#2B5C96" font-weight="bold">P17–24</text></g>
  <g id="scope-note" data-pptx-bounds="64 556 1152 78"><text x="64" y="581" font-size="22" fill="#1F2A37">画面・番号・氏名は架空の同梱サンプルです。実運用の表示は設定で変わります。</text><text x="64" y="617" font-size="18" fill="#5D6B7A">対象は従来版。細かな設定の書き方は、リポジトリのREADMEへ進んでください。</text></g>
  <g id="footer" data-pptx-bounds="64 664 1152 26" fill="#5D6B7A" font-size="14"><text x="64" y="682">本書の構成　／　操作は同梱サンプルで確認</text><text x="1216" y="682" text-anchor="end">03 / 24</text></g>
