<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="'Yu Gothic UI','Segoe UI',sans-serif">
  <rect id="background" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" />
  <g id="heading" data-pptx-bounds="64 36 1152 98" font-weight="bold"><text x="64" y="58" font-size="18" fill="#C05B21">03　更新・削除・共有　／　複数PCの配置</text><text x="64" y="112" font-size="40" fill="#24507F">複数PCでは、全員が同じ共有台帳を使う</text></g>
  <g id="shared-topology" data-pptx-bounds="64 184 1152 259">
    <line x1="376" y1="294" x2="490" y2="294" stroke="#2B5C96" stroke-width="3" />
    <line x1="790" y1="294" x2="904" y2="294" stroke="#2B5C96" stroke-width="3" />
    <g id="pc-a"><rect x="64" y="184" width="312" height="259" rx="12" fill="#F2F6FB" /><text x="90" y="230" font-size="30" fill="#24507F" font-weight="bold">PC A</text><text x="90" y="284" font-size="22" fill="#1F2A37">アプリと設定<tspan x="90" dy="34">このPCの未送信変更</tspan></text><text x="90" y="408" font-size="18" fill="#C05B21">未送信はPC Aに残る</text></g>
    <g id="one-ledger"><rect x="490" y="210" width="300" height="207" rx="12" fill="#24507F" /><text x="516" y="259" font-size="30" fill="#FFFFFF" font-weight="bold">1つの共有台帳</text><text x="516" y="313" font-size="22" fill="#FFFFFF">全PCから同じパスへ<tspan x="516" dy="34">送信・読み直し</tspan></text><text x="516" y="391" font-size="18" fill="#FFFFFF">付随ファイルも同じ場所</text></g>
    <g id="pc-b"><rect x="904" y="184" width="312" height="259" rx="12" fill="#F2F6FB" /><text x="930" y="230" font-size="30" fill="#24507F" font-weight="bold">PC B</text><text x="930" y="284" font-size="22" fill="#1F2A37">アプリと設定<tspan x="930" dy="34">このPCの未送信変更</tspan></text><text x="930" y="408" font-size="18" fill="#C05B21">未送信はPC Bに残る</text></g>
  </g>
  <g id="shared-rules" data-pptx-bounds="64 481 718 159"><text x="64" y="514" font-size="26" fill="#24507F" font-weight="bold">版・台帳の定義・共有先の権限を揃える。</text><text x="64" y="563" font-size="22" fill="#1F2A37">送信時には、共有先をロックして最新台帳を読み直します。<tspan x="64" dy="34">他の変更と競合した未送信分は残り、理由を確認できます。</tspan></text><text x="64" y="632" font-size="18" fill="#5D6B7A">台帳だけでなく、一時ファイル・付随ファイルの操作権限も必要です。</text></g>
  <g id="shared-note" data-pptx-bounds="842 483 374 151"><rect x="842" y="483" width="374" height="151" rx="12" fill="#F2F6FB" /><text x="866" y="521" font-size="22" fill="#C05B21" font-weight="bold">Excelで開いているとき</text><text x="866" y="563" font-size="18" fill="#1F2A37">台帳を保存できないことがあります。<tspan x="866" dy="30">使用中の人を確認してください。</tspan></text></g>
  <g id="footer" data-pptx-bounds="64 664 1152 26" fill="#5D6B7A" font-size="14"><text x="64" y="682">出典：docs/shared-ledger.md「配置」「送信処理」　／　仕組みの図。今回の制作で複数PC試験は未実施</text><text x="1216" y="682" text-anchor="end">22 / 24</text></g>
</svg>
