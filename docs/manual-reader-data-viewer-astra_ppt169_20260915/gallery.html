<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reader Data Viewer 操作マニュアル · Astra版</title>
<style>
:root{color-scheme:light;--navy:#24507f;--orange:#c05b21;--ink:#1f2a37;--line:#cfd7de;--pale:#f2f6fb}
*{box-sizing:border-box}body{margin:0;background:var(--pale);color:var(--ink);font:16px/1.6 "Yu Gothic UI","Segoe UI",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:20px 28px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:22px;line-height:1.4;margin:0;color:var(--navy)}header p{margin:4px 0 0;color:#5d6b7a;font-size:14px}nav{display:flex;gap:10px;flex-wrap:wrap}
a,button,select{font:inherit}a{color:var(--navy)}.download,button,select{border:1px solid var(--line);border-radius:7px;background:white;color:var(--navy);padding:8px 14px;text-decoration:none}button,select{cursor:pointer}button:hover,.download:hover{border-color:var(--navy)}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
main{max-width:1600px;margin:auto;padding:20px 28px 36px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar select{max-width:min(580px,100%);flex:1}.counter{font-variant-numeric:tabular-nums;color:#5d6b7a;min-width:66px;text-align:center}
.stage{background:white;border:1px solid var(--line);border-radius:8px;overflow:auto;box-shadow:0 8px 24px #24507f0c}.stage img{display:block;width:100%;height:auto;cursor:zoom-in}.stage.zoom{max-height:85vh}.stage.zoom img{width:1920px;max-width:none;cursor:zoom-out}.hint{margin:8px 0 24px;color:#5d6b7a;font-size:14px}.section-title{font-size:18px;color:var(--navy);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.thumb{padding:0;overflow:hidden;text-align:left;color:var(--ink);border:2px solid transparent;box-shadow:0 0 0 1px var(--line)}.thumb[aria-current=true]{border-color:var(--orange)}.thumb img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:white}.thumb span{display:block;padding:9px 11px;font-size:14px}.thumb b{color:var(--orange);margin-right:7px;font-variant-numeric:tabular-nums}
footer{padding:24px 0 0;color:#5d6b7a;font-size:13px}#error{color:#b42318} @media(max-width:600px){header{padding:16px}main{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}h1{font-size:19px}.toolbar button{padding:8px 11px}.toolbar select{flex-basis:100%;order:2}}
</style>
</head>
<body>
<header><div><h1>Reader Data Viewer 操作マニュアル</h1><p>Astra版 · 全24枚 · 2026年9月15日</p></div><nav aria-label="ファイルを開く"><a class="download" href="exports/manual-reader-data-viewer-astra_20260915_1112.pdf">PDFを開く</a><a class="download" href="exports/manual-reader-data-viewer-astra_20260915_1112.pptx" download>PowerPointを保存</a></nav></header>
<main>
<div class="toolbar"><button id="prev" type="button" aria-label="前のスライド">← 前へ</button><span class="counter" id="counter" aria-live="polite"></span><button id="next" type="button" aria-label="次のスライド">次へ →</button><select id="pages" aria-label="スライドを選ぶ"></select><button id="zoom" type="button" aria-pressed="false">拡大する</button></div>
<div class="stage" id="stage"><img id="slide" src="exports/slides/slide-01.png" alt="1枚目：表紙"></div>
<p class="hint">左右の矢印キーで前後へ。画像をクリックすると拡大・縮小します。</p><p id="error" hidden>画像を開けません。このHTMLとexportsフォルダを一緒に配置してください。</p>
<h2 class="section-title">全ページ</h2><div class="grid" id="grid"></div>
<footer>従来版 adcba63 · 架空の同梱サンプル。自動読取・複数PCのページは仕組みの説明です。対象と確認範囲は<a href="README.md">同梱README</a>へ。</footer>
</main>
<script>
'use strict';
const titles=['表紙','アプリの流れ','目次','配置と起動の準備','初回の台帳作成','入力と処理を確認','主画面の読み方','まず1件を検索','未決済の表示','③がない行','複数候補から選ぶ','処理状態を付ける','変更をまとめて送信','状態を戻す','出力項目を選ぶ','条件付きCSV','入力を更新する','削除の条件','削除結果を確認','設定の入口','自動読取の仕組み','複数PCの配置','困ったとき','練習する1件'];
const byId=id=>document.getElementById(id);
const file=n=>'exports/slides/slide-'+String(n).padStart(2,'0')+'.png';
let current=1;
titles.forEach((title,i)=>{
 const n=i+1,option=document.createElement('option');option.value=n;option.textContent=String(n).padStart(2,'0')+' — '+title;byId('pages').append(option);
 const button=document.createElement('button');button.type='button';button.className='thumb';button.setAttribute('aria-label',n+'枚目：'+title);
 const image=document.createElement('img');image.src=file(n);image.alt='';image.loading='lazy';
 const label=document.createElement('span'),number=document.createElement('b');number.textContent=String(n).padStart(2,'0');label.append(number,document.createTextNode(title));button.append(image,label);button.addEventListener('click',()=>{show(n);byId('stage').scrollIntoView({behavior:'smooth',block:'start'});});byId('grid').append(button);
});
function show(n){
 current=Math.max(1,Math.min(titles.length,n));byId('slide').src=file(current);byId('slide').alt=current+'枚目：'+titles[current-1];byId('pages').value=current;byId('counter').textContent=current+' / '+titles.length;byId('prev').disabled=current===1;byId('next').disabled=current===titles.length;
 document.querySelectorAll('.thumb').forEach((button,i)=>button.setAttribute('aria-current',String(i+1===current)));history.replaceState(null,'','#'+current);
}
function zoom(){const enabled=byId('stage').classList.toggle('zoom');byId('zoom').textContent=enabled?'全体を見る':'拡大する';byId('zoom').setAttribute('aria-pressed',String(enabled));}
byId('prev').addEventListener('click',()=>show(current-1));byId('next').addEventListener('click',()=>show(current+1));byId('pages').addEventListener('change',event=>show(Number(event.target.value)));byId('zoom').addEventListener('click',zoom);byId('slide').addEventListener('click',zoom);byId('slide').addEventListener('error',()=>byId('error').hidden=false);byId('slide').addEventListener('load',()=>byId('error').hidden=true);
document.addEventListener('keydown',event=>{if(event.target.matches('select,input,textarea'))return;if(event.key==='ArrowRight'){event.preventDefault();show(current+1);}if(event.key==='ArrowLeft'){event.preventDefault();show(current-1);}if(event.key==='Home'){event.preventDefault();show(1);}if(event.key==='End'){event.preventDefault();show(titles.length);}});
const start=Number(location.hash.slice(1));show(Number.isInteger(start)&&start>=1&&start<=titles.length?start:1);
</script>
</body>
</html>
